# =============================================================================
# CodeMender CI/CD Guardrail: PIPELINE SKELETON
# =============================================================================
# This is the pipeline skeleton for the codelab. It deliberately does not run
# as-is. It lives under lab/templates/ (outside .github/workflows/) so GitHub
# Actions never picks it up.
#
# Copy it into place, then fill in the seven TODOs:
#
#     mkdir -p .github/workflows
#     cp lab/templates/codemender-pipeline.template.yaml \
#        .github/workflows/codemender-pipeline.yml
#
# A completed reference implementation lives at
# lab/solutions/codemender-pipeline.solution.yaml. Try each TODO yourself
# first, then diff the two files.
# =============================================================================

name: CodeMender CI/CD Guardrail

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ '**.md', 'lab/**', '.gitignore' ]
  workflow_dispatch:

permissions:
  # TODO 1: Three permissions are required here. Work out which, and why.
  #   - one to let the job push a remediation branch
  #   - one to let the job open a pull request
  #   - one to let GitHub mint the OIDC token that WIF exchanges for GCP credentials

env:
  SCAN_PATH: src/services
  CM_BUNDLED: lab/bin/cm-linux
  CM_MODEL: gemini-3.7-flash
  CM_FIX_LIMIT: "1"

jobs:
  codemender-security:
    name: Scan, Identify, and Patch
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud (WIF / ADC)
        # TODO 2: Use google-github-actions/auth@v2.
        #   Wire the three repository variables you created into the
        #   workload_identity_provider, service_account and project_id inputs.

      - name: Install CodeMender CLI (cm)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmbin"
          install -m 0755 "$CM_BUNDLED" "$RUNNER_TEMP/cmbin/cm"
          echo "$RUNNER_TEMP/cmbin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cmbin/cm" --version

      - name: Initialize CodeMender Workspace
        # TODO 3: Initialize the CodeMender workspace in the checked-out repo.

      - name: CodeMender Scan
        id: scan
        # TODO 4: Run a CodeMender discovery scan over $SCAN_PATH.
        #   Requirements:
        #     - non-interactive (CI has no TTY to answer prompts)
        #     - pin the model to $CM_MODEL
        #     - the agent must be able to read across the whole repo, not just $SCAN_PATH
        #     - tee the output to $RUNNER_TEMP/cm-find.log so you can debug it later

      - name: Export Security Report
        if: always()
        # TODO 5: Emit the findings as machine-readable JSON to
        #   $RUNNER_TEMP/cm-security-report.json so the triage script can parse it.

      - name: Triage Findings
        id: triage
        run: |
          python3 .github/scripts/cm_triage.py "$RUNNER_TEMP/cm-security-report.json"

      - name: Autonomous Remediation
        id: fix
        if: ${{ steps.triage.outputs.fix_ids != '' }}
        # TODO 6: For each finding ID in steps.triage.outputs.fix_ids, ask
        #   CodeMender to generate and apply a patch. Same non-interactive and
        #   model requirements as the scan step. Stop after $CM_FIX_LIMIT fixes
        #   so the lab finishes quickly.
        #
        #   Defensive extra: cm fix edits the working tree in place, but the
        #   helper at .github/scripts/extract_cm_diff.py can recover a unified
        #   diff from the cm fix log if you want to apply the patch explicitly.

      - name: Open Remediation Pull Request
        id: pr
        if: ${{ steps.fix.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: codemender/auto-remediation
          delete-branch: true
          commit-message: "fix(security): CodeMender autonomous remediation"
          title: "CodeMender: autonomous security remediation"
          body: "Auto-remediated HIGH/CRITICAL findings via cm fix."

      - name: Security Gate
        if: always()
        # TODO 7: Fail the job if the triage step reported any HIGH or CRITICAL
        #   findings. Read steps.triage.outputs.high_critical.
